[package]
name = "cantini_auto_gps"
version = "1.1.0"
edition = "2021"
description = "Geotag photos from a GPX track"
license = "MIT"
repository = "https://github.com/rmcantini/CantiniAutoGPS"

[dependencies]
eframe = { version = "0.29", features = ["persistence"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.bundle]
name = "CantiniAutoGPS"
identifier = "com.cantini.autogps"
version = "1.1.0"
icon = [
    "icons/32x32.png",
    "icons/128x128.png",
    "icons/128x128@2x.png",
    "icons/256x256.png",
    "icons/256x256@2x.png",
    "icons/512x512.png",
]
category = "Photography"
resources = ["vendor/exiftool", "LICENSE", "THIRD_PARTY_LICENSES.md"]
short_description = "Geotag photos from a GPX track"

