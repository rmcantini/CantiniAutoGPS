[package]
name = "cantini_auto_gps"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.29", features = ["persistence"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }

[package.metadata.bundle]
name = "CantiniAutoGPS"
identifier = "com.cantini.autogps"
version = "0.1.0"
icon = [
    "icons/32x32.png",
    "icons/128x128.png",
    "icons/128x128@2x.png",
    "icons/256x256.png",
    "icons/256x256@2x.png",
    "icons/512x512.png",
]
category = "Photography"
short_description = "Geotag photos from a GPX track"

