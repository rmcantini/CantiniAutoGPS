name: Build

# Pushes to main and manual runs build and test both platforms and keep the results as
# workflow artifacts. Pushing a tag like v1.1.0 additionally publishes a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $appVersion = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value

          # Download the Windows build of ExifTool and verify it against exiftool.org's checksum.
          $etVersion = (Invoke-RestMethod https://exiftool.org/ver.txt).ToString().Trim()
          $zip = "exiftool-${etVersion}_64.zip"
          # The zip is hosted on SourceForge (linked from exiftool.org); checksums come from exiftool.org.
          curl.exe --fail --location --silent --show-error --output $zip "https://sourceforge.net/projects/exiftool/files/$zip/download"
          if ($LASTEXITCODE -ne 0) { throw "Download of $zip failed" }
          $sums = Invoke-RestMethod https://exiftool.org/checksums.txt
          $m = [regex]::Match($sums, "SHA2-256\($([regex]::Escape($zip))\)\s*=\s*([0-9a-fA-F]{64})")
          if (-not $m.Success) { throw "No SHA2-256 checksum found for $zip" }
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $m.Groups[1].Value.ToLower()) { throw "Checksum mismatch for $zip" }
          Write-Host "ExifTool $etVersion verified ($actual)"
          Expand-Archive $zip -DestinationPath et

          $name = "CantiniAutoGPS-$appVersion-windows-x64"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/cantini_auto_gps.exe "$dir/CantiniAutoGPS.exe"
          $etDir = Get-ChildItem et -Directory | Select-Object -First 1
          Copy-Item "$($etDir.FullName)/exiftool(-k).exe" "$dir/exiftool.exe"
          Copy-Item "$($etDir.FullName)/exiftool_files" "$dir/exiftool_files" -Recurse
          Copy-Item LICENSE, THIRD_PARTY_LICENSES.md "$dir/"
          Copy-Item packaging/windows/NOTICE-ExifTool.txt "$dir/"
          Copy-Item vendor/exiftool/LICENSE-Artistic.txt "$dir/LICENSE-ExifTool-Artistic.txt"
          "ExifTool $etVersion" | Out-File "$dir/EXIFTOOL-VERSION.txt"
          Compress-Archive -Path $dir -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest # Apple silicon
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: cargo test --release

      - name: Install cargo-bundle
        run: cargo install cargo-bundle --locked

      - name: Bundle, sign (ad hoc) and make DMG
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          cargo bundle --release
          APP=target/release/bundle/osx/CantiniAutoGPS.app
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p dist
          hdiutil create -quiet -volname "CantiniAutoGPS $VERSION" -srcfolder "$STAGE" -ov -format UDZO "dist/CantiniAutoGPS-$VERSION-macOS-arm64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  linux:
    # Built on the oldest hosted Ubuntu so the AppImage runs on distros with glibc 2.35 or newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Show shared library dependencies
        run: ldd target/release/cantini_auto_gps

      - name: Package AppImage
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')

          # Pinned packaging tools, verified by SHA-256.
          curl -fsSL -o appimagetool-x86_64.AppImage https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -fsSL -o runtime-x86_64 https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool-x86_64.AppImage" | sha256sum -c -
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  runtime-x86_64" | sha256sum -c -
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract >/dev/null

          APPDIR=AppDir
          mkdir -p $APPDIR/usr/bin $APPDIR/usr/share/doc/cantini-autogps
          cp target/release/cantini_auto_gps $APPDIR/usr/bin/
          cp -R vendor/exiftool $APPDIR/usr/bin/exiftool
          cp LICENSE THIRD_PARTY_LICENSES.md $APPDIR/usr/share/doc/cantini-autogps/
          cp packaging/linux/cantini-autogps.desktop $APPDIR/
          cp icons/256x256.png $APPDIR/cantini-autogps.png
          cp icons/256x256.png $APPDIR/.DirIcon
          printf '%s\n' '#!/bin/sh' 'HERE="$(dirname "$(readlink -f "$0")")"' 'exec "$HERE/usr/bin/cantini_auto_gps" "$@"' > $APPDIR/AppRun
          chmod +x $APPDIR/AppRun

          mkdir -p dist
          ARCH=x86_64 squashfs-root/AppRun --runtime-file runtime-x86_64 $APPDIR "dist/CantiniAutoGPS-$VERSION-linux-x86_64.AppImage"
          chmod +x dist/*.AppImage
          ls -la dist

      - name: Smoke test (virtual display)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libegl1 libxkbcommon0 libxkbcommon-x11-0
          APP=$(ls dist/*.AppImage)
          # Finds its bundled ExifTool when run from inside the AppImage:
          out=$("$APP" --appimage-extract-and-run --check-exiftool)
          echo "$out"
          echo "$out" | grep -q "bundled ExifTool"
          # Starts and keeps running for a few seconds without crashing:
          set +e
          timeout 8 xvfb-run -a "$APP" --appimage-extract-and-run
          code=$?
          set -e
          echo "exit code: $code (124 means still running when stopped)"
          [ "$code" -eq 124 ]

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        run: |
          set -euo pipefail
          ls -la artifacts
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" \
              --title "CantiniAutoGPS ${TAG#v}" --generate-notes
          fi
